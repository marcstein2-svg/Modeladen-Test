<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Seite nicht gefunden | Schütz Mode in Hof</title>
  <!-- Eigenständig gestaltet (ohne externe CSS-Datei), damit die Seite auf jeder Ebene funktioniert. -->
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:#faf6ef;color:#16120f;font:1.0625rem/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-align:center}
    main{max-width:30rem}
    .code{margin:0;font:700 clamp(5rem,26vw,9rem)/1 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;color:#c1121f;letter-spacing:-.03em}
    h1{margin:.2em 0 .4em;font:600 clamp(1.7rem,6vw,2.4rem)/1.15 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
    a.btn{display:inline-flex;align-items:center;min-height:48px;padding:.7rem 1.6rem;border-radius:999px;background:#c1121f;color:#fff;font-weight:600;text-decoration:none}
    a.btn:hover{background:#9e0f1a}
    a.btn:focus-visible{outline:3px solid #16120f;outline-offset:3px}
  </style>
  <script>
    // Alte WordPress-Adressen auf die neue Seite umleiten
    (function () {
      var map = {
        '/mode': '/#mode',
        '/betten-fachgeschaft': '/#betten',
        '/kontakt': '/#kontakt',
        '/impressum': '/impressum.html',
        '/impressum/datenschutz': '/datenschutz.html'
      };
      var target = map[location.pathname.replace(/\/+$/, '').toLowerCase()];
      if (target) location.replace(target);
    })();
  </script>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Diese Seite gibt es nicht.</h1>
    <p>Vielleicht hat sich die Adresse geändert. Auf der Startseite finden Sie Mode, Betten und alle Kontaktdaten.</p>
    <p><a class="btn" href="/">Zur Startseite</a></p>
  </main>
</body>
</html>
